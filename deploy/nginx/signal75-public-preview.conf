server {
    listen 127.0.0.1:8751;
    server_name localhost;

    root /var/www/signal75-public-preview-current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:json)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
