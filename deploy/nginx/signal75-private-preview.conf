server {
    listen 127.0.0.1:8750;
    server_name localhost;

    root /var/www/signal75-preview-current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
