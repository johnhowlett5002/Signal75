name: Signal 75 Scoring Regression

on:
  push:
    paths:
      - 'scripts/scoring_engine.py'
      - 'tests/**'
      - '.github/workflows/scoring-regression.yml'
  pull_request:
    paths:
      - 'scripts/scoring_engine.py'
      - 'tests/**'
      - '.github/workflows/scoring-regression.yml'
  workflow_dispatch:

jobs:
  scoring-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run scoring regression tests
        run: python -m pytest tests/ -v
